<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Snoutley – Löydetty koira</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#213731">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Frank+Ruhl+Libre:wght@500;700&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #213731;
      --text-strong: #fefcf9;
      --text-muted: rgba(254, 252, 249, 0.72);
      --text-faint: rgba(254, 252, 249, 0.5);
      --accent: #ee8b00;
      --accent-hover: #ffa020;
      --accent-text: #fefcf9;
      --divider: rgba(254, 252, 249, 0.16);
      --callout-bg: rgba(254, 252, 249, 0.08);
      --callout-border: #ee8b00;
      --focus-ring: #fefcf9;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text-strong);
      font-family: 'Libre Franklin', sans-serif;
    }

    @font-face {
      font-family: 'SnoutleyFont';
      src: url('Snoutley-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    a { color: inherit; }

    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 3px;
    }

    .bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ---------- Name block ---------- */
    .name-block {
      text-align: center;
      padding: 4rem 1.5rem 2rem;
    }

    .dog-name {
      font-family: 'SnoutleyFont', 'Frank Ruhl Libre', serif;
      font-size: clamp(3.4rem, 18vw, 6rem);
      line-height: 0.95;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-strong);
      margin: 0 0 0.9rem;
    }

    .lost-message {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.5;
    }

    .hero-title {
      font-family: 'Frank Ruhl Libre', serif;
      font-weight: 500;
      font-size: clamp(1.5rem, 6vw, 2rem);
      color: var(--text-strong);
      margin: 0;
      line-height: 1.3;
    }

    /* ---------- Content ---------- */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1.5rem 2.5rem;
    }

    .content-inner {
      width: 100%;
      max-width: 420px;
    }

    /* ---------- Button ---------- */
    .call-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      width: 100%;
      padding: 1.15rem 1rem;
      background-color: var(--accent);
      color: var(--accent-text);
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .call-button:hover { background-color: var(--accent-hover); }

    .call-button-label {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #fefcf9;
    }

    .call-button-number {
      font-family: 'Libre Franklin', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      color: #fefcf9;
      opacity: 0.9;
    }

    /* ---------- Rows ---------- */
    .row {
      text-align: center;
      margin-top: 1.4rem;
    }

    .row-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin: 0 0 0.35rem;
    }

    .row-value {
      font-family: 'Frank Ruhl Libre', serif;
      font-weight: 500;
      font-size: 1.35rem;
      color: var(--text-strong);
      margin: 0;
      line-height: 1.3;
    }

    .divider {
      height: 1px;
      width: 100%;
      background: var(--divider);
      border: none;
      margin: 1.8rem 0 0;
    }

    .callout {
      background: var(--callout-bg);
      border-left: 3px solid var(--callout-border);
      padding: 0.9rem 1.1rem;
      border-radius: 4px;
      text-align: left;
      margin-top: 1.8rem;
    }

    .callout .row-label { color: var(--text-muted); }

    /* ---------- Footer ---------- */
    .footer {
      text-align: center;
      padding: 2rem 1.5rem 2rem;
    }

    .logo {
      max-width: 84px;
      margin-bottom: 0.7rem;
    }

    .powered-by {
      font-size: 0.72rem;
      color: var(--text-faint);
      margin: 0;
    }

    .powered-by a {
      text-decoration: none;
      border-bottom: 1px solid var(--divider);
    }
    .powered-by a:hover { border-bottom-color: var(--text-faint); }
  </style>
</head>
<body>
  <canvas class="bg-canvas" id="bg-canvas"></canvas>
  <div class="page">
    <div class="name-block" id="name-block"></div>
    <div class="content">
      <div class="content-inner">
        <div id="call-button"></div>
        <div id="contact-row"></div>
        <div id="allergy-row"></div>
      </div>
    </div>
    <div class="footer">
      <img src="snoutley_inverted_green.svg" alt="Snoutley logo" class="logo">
      <p class="powered-by">powered by <a href="https://snoutley.fi" target="_blank">Snoutley</a></p>
    </div>
  </div>

  <script>
    const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);

    const nameBlock = document.getElementById("name-block");
    const contactRow = document.getElementById("contact-row");
    const allergyRow = document.getElementById("allergy-row");
    const callButton = document.getElementById("call-button");

    const lang = navigator.language.startsWith("ru") ? "ru" :
                 navigator.language.startsWith("uk") ? "uk" :
                 navigator.language.startsWith("sv") ? "sv" :
                 navigator.language.startsWith("fi") ? "fi" : "en";
    const raw = location.hash.substring(1).replace(/\+/g, ' ');
    const data = decodeURIComponent(raw).split("|");

    if (data.length >= 4) {
      const [name, phone, dog, allergyVal] = data;
      const translations = {
        fi: {
          lostMessage: "Olen eksynyt, ole hyvä ja ota yhteyttä omistajaani.",
          ownerLabel: "Omistaja",
          allergyLabel: "Tärkeää tietoa",
          button: "Soita omistajalle",
        },
        sv: {
          lostMessage: "Jag är vilse, kontakta gärna min ägare.",
          ownerLabel: "Ägare",
          allergyLabel: "Viktig information",
          button: "Ring ägaren",
        },
        ru: {
          lostMessage: "Я потерялся, пожалуйста, свяжитесь с моим владельцем.",
          ownerLabel: "Владелец",
          allergyLabel: "Важная информация",
          button: "Позвонить владельцу",
        },
        uk: {
          lostMessage: "Я загубився, будь ласка, зв'яжіться з моїм власником.",
          ownerLabel: "Власник",
          allergyLabel: "Важлива інформація",
          button: "Зателефонувати власнику",
        },
        en: {
          lostMessage: "I'm lost, please contact my owner.",
          ownerLabel: "Owner",
          allergyLabel: "Important info",
          button: "Call owner",
        }
      };
      const t = translations[lang];

      nameBlock.innerHTML = `
        <p class="dog-name">${dog}</p>
        <p class="lost-message">${t.lostMessage}</p>
      `;
      callButton.innerHTML = `
        <a class="call-button" href="tel:${phone}">
          <span class="call-button-label">${t.button}</span>
          <span class="call-button-number">${phone}</span>
        </a>`;
      contactRow.innerHTML = `
        <div class="row">
          <p class="row-label">${t.ownerLabel}</p>
          <p class="row-value">${capitalize(name)}</p>
        </div>`;
      allergyRow.innerHTML = `
        <hr class="divider">
        <div class="row callout">
          <p class="row-label">${t.allergyLabel}</p>
          <p class="row-value">${allergyVal}</p>
        </div>`;
    } else {
      nameBlock.innerHTML = `<p class="hero-title">Virhe: tietojen lukeminen epäonnistui.</p>`;
    }

    // Seeded random — always produces the same pattern
    function seededRandom(seed) {
      let s = seed;
      return function() {
        s = (s * 16807 + 0) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    // Full-page background pattern. The mark's dark-green fill blends
    // into the page background, leaving only its white detail lines
    // visible — a consistent look since the background is always
    // the brand dark green now.
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");
    const img = new Image();
    img.src = "favicon.svg";

    function drawPattern() {
      const rand = seededRandom(42);
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 0.16;

      const iconSize = 34;
      const spacing = 78;
      const cols = Math.ceil(canvas.width / spacing) + 2;
      const rows = Math.ceil(canvas.height / spacing) + 2;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const x = col * spacing + (rand() * 18 - 9);
          const y = row * spacing + (col % 2 === 0 ? 0 : spacing / 2) + (rand() * 18 - 9);
          const angle = rand() * Math.PI * 2;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);
          ctx.drawImage(img, -iconSize / 2, -iconSize / 2, iconSize, iconSize);
          ctx.restore();
        }
      }
    }

    img.onload = drawPattern;
    window.addEventListener('resize', drawPattern);
  </script>
</body>
</html>
