<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Snoutley – Löydetty koira</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fefcf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14201b" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Frank+Ruhl+Libre:wght@500;700&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fefcf9;
      --panel-bg: #213731;
      --panel-text: #fefcf9;
      --panel-text-muted: rgba(254, 252, 249, 0.68);
      --text-strong: #213731;
      --text-muted: rgba(33, 55, 49, 0.68);
      --text-faint: rgba(33, 55, 49, 0.5);
      --accent: #ee8b00;
      --accent-hover: #d17c00;
      --accent-text: #213731;
      --divider: rgba(33, 55, 49, 0.15);
      --callout-bg: #f4ebdd;
      --callout-border: #ee8b00;
      --focus-ring: #213731;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14201b;
        --panel-bg: #213731;
        --panel-text: #fefcf9;
        --panel-text-muted: rgba(254, 252, 249, 0.68);
        --text-strong: #fefcf9;
        --text-muted: rgba(254, 252, 249, 0.68);
        --text-faint: rgba(254, 252, 249, 0.48);
        --accent: #ee8b00;
        --accent-hover: #ffa020;
        --accent-text: #182620;
        --divider: rgba(254, 252, 249, 0.15);
        --callout-bg: rgba(238, 139, 0, 0.12);
        --callout-border: #ee8b00;
        --focus-ring: #fefcf9;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text-strong);
      font-family: 'Libre Franklin', sans-serif;
      transition: background-color 0.2s ease;
    }

    @font-face {
      font-family: 'SnoutleyFont';
      src: url('Snoutley-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    a { color: inherit; }

    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 3px;
    }

    .page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ---------- Header band ---------- */
    .hero {
      position: relative;
      background-color: var(--panel-bg);
      overflow: hidden;
      padding: 3.5rem 1.5rem 3rem;
      text-align: center;
    }

    .hero-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      max-width: 460px;
      margin: 0 auto;
    }

    .eyebrow {
      font-family: 'Libre Franklin', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--panel-text-muted);
      margin: 0 0 0.9rem;
    }

    .dog-name {
      font-family: 'SnoutleyFont', 'Frank Ruhl Libre', serif;
      font-size: clamp(2.6rem, 13vw, 4.2rem);
      line-height: 1;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--panel-text);
      margin: 0;
    }

    .hero-title {
      font-family: 'Frank Ruhl Libre', serif;
      font-weight: 500;
      font-size: clamp(1.6rem, 6vw, 2.1rem);
      color: var(--panel-text);
      margin: 0;
      line-height: 1.25;
    }

    /* ---------- Content ---------- */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.2rem 1.5rem 2.5rem;
    }

    .content-inner {
      width: 100%;
      max-width: 420px;
    }

    .lost-message {
      font-size: 1rem;
      color: var(--text-muted);
      text-align: center;
      margin: 0 0 2rem;
      line-height: 1.5;
    }

    .divider {
      height: 1px;
      width: 100%;
      background: var(--divider);
      border: none;
      margin: 0 0 1.6rem;
    }

    .row {
      margin-bottom: 1.6rem;
    }

    .row-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin: 0 0 0.35rem;
    }

    .row-value {
      font-family: 'Frank Ruhl Libre', serif;
      font-weight: 500;
      font-size: 1.5rem;
      color: var(--text-strong);
      margin: 0;
      line-height: 1.3;
    }

    .callout {
      background: var(--callout-bg);
      border-left: 3px solid var(--callout-border);
      padding: 0.9rem 1.1rem;
      border-radius: 4px;
    }

    .callout .row-label { color: var(--text-muted); }

    /* ---------- Button ---------- */
    .call-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      width: 100%;
      padding: 1.05rem 1rem;
      margin-top: 0.6rem;
      background-color: var(--accent);
      color: var(--accent-text);
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .call-button:hover { background-color: var(--accent-hover); }

    .call-button-label {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .call-button-number {
      font-family: 'Libre Franklin', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      opacity: 0.85;
    }

    /* ---------- Footer ---------- */
    .footer {
      text-align: center;
      padding: 0 1.5rem 2rem;
    }

    .logo {
      max-width: 84px;
      margin-bottom: 0.7rem;
    }

    .logo-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .logo-light { display: none; }
      .logo-dark { display: block; margin: 0 auto 0.7rem; }
    }

    .powered-by {
      font-size: 0.72rem;
      color: var(--text-faint);
      margin: 0;
    }

    .powered-by a {
      text-decoration: none;
      border-bottom: 1px solid var(--divider);
    }
    .powered-by a:hover { border-bottom-color: var(--text-faint); }

    /* ---------- Error / not-found state ---------- */
    .error-text {
      text-align: center;
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <canvas class="hero-canvas" id="bg-canvas"></canvas>
      <div class="hero-inner" id="hero-inner"></div>
    </div>
    <div class="content">
      <div class="content-inner">
        <div id="lost-message"></div>
        <hr class="divider" id="divider" style="display:none;">
        <div id="contact-row"></div>
        <div id="allergy-row"></div>
        <div id="call-button"></div>
      </div>
    </div>
    <div class="footer">
      <img src="green_snoutley.svg" alt="Snoutley logo" class="logo logo-light">
      <img src="snoutley_inverted_green.svg" alt="Snoutley logo" class="logo logo-dark">
      <p class="powered-by">powered by <a href="https://snoutley.fi" target="_blank">Snoutley</a></p>
    </div>
  </div>

  <script>
    const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);

    const heroInner = document.getElementById("hero-inner");
    const lostMessageEl = document.getElementById("lost-message");
    const dividerEl = document.getElementById("divider");
    const contactRow = document.getElementById("contact-row");
    const allergyRow = document.getElementById("allergy-row");
    const callButton = document.getElementById("call-button");

    const lang = navigator.language.startsWith("ru") ? "ru" :
                 navigator.language.startsWith("uk") ? "uk" :
                 navigator.language.startsWith("sv") ? "sv" :
                 navigator.language.startsWith("fi") ? "fi" : "en";
    const raw = location.hash.substring(1).replace(/\+/g, ' ');
    const data = decodeURIComponent(raw).split("|");

    if (data.length >= 4) {
      const [name, phone, dog, allergyVal] = data;
      const translations = {
        fi: {
          eyebrow: "Löytynyt koira",
          lostMessage: "Olen eksynyt, ole hyvä ja ota yhteyttä omistajaani.",
          ownerLabel: "Omistaja",
          allergyLabel: "Tärkeää tietoa",
          button: "Soita omistajalle",
        },
        sv: {
          eyebrow: "Hittad hund",
          lostMessage: "Jag är vilse, kontakta gärna min ägare.",
          ownerLabel: "Ägare",
          allergyLabel: "Viktig information",
          button: "Ring ägaren",
        },
        ru: {
          eyebrow: "Найдена собака",
          lostMessage: "Я потерялся, пожалуйста, свяжитесь с моим владельцем.",
          ownerLabel: "Владелец",
          allergyLabel: "Важная информация",
          button: "Позвонить владельцу",
        },
        uk: {
          eyebrow: "Знайдено собаку",
          lostMessage: "Я загубився, будь ласка, зв'яжіться з моїм власником.",
          ownerLabel: "Власник",
          allergyLabel: "Важлива інформація",
          button: "Зателефонувати власнику",
        },
        en: {
          eyebrow: "Found dog",
          lostMessage: "I'm lost, please contact my owner.",
          ownerLabel: "Owner",
          allergyLabel: "Important info",
          button: "Call owner",
        }
      };
      const t = translations[lang];

      heroInner.innerHTML = `
        <p class="eyebrow">${t.eyebrow}</p>
        <p class="dog-name">${dog}</p>
      `;
      lostMessageEl.innerHTML = `<p class="lost-message">${t.lostMessage}</p>`;
      dividerEl.style.display = "block";
      contactRow.innerHTML = `
        <div class="row">
          <p class="row-label">${t.ownerLabel}</p>
          <p class="row-value">${capitalize(name)}</p>
        </div>`;
      allergyRow.innerHTML = `
        <div class="row callout">
          <p class="row-label">${t.allergyLabel}</p>
          <p class="row-value">${allergyVal}</p>
        </div>`;
      callButton.innerHTML = `
        <a class="call-button" href="tel:${phone}">
          <span class="call-button-label">${t.button}</span>
          <span class="call-button-number">${phone}</span>
        </a>`;
    } else {
      heroInner.innerHTML = `
        <p class="eyebrow">Snoutley</p>
        <p class="hero-title">Virhe: tietojen lukeminen epäonnistui.</p>
      `;
    }

    // Seeded random — always produces the same pattern
    function seededRandom(seed) {
      let s = seed;
      return function() {
        s = (s * 16807 + 0) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    // Background pattern, confined to the hero band only.
    // The mark's dark-green fill blends into the panel background,
    // leaving only its white detail lines visible — no color filtering
    // needed since the panel is always dark green in both themes.
    const hero = document.querySelector('.hero');
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");
    const img = new Image();
    img.src = "favicon.svg";

    function drawPattern() {
      const rand = seededRandom(42);
      const rect = hero.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 0.22;

      const iconSize = 30;
      const spacing = 62;
      const cols = Math.ceil(canvas.width / spacing) + 2;
      const rows = Math.ceil(canvas.height / spacing) + 2;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const x = col * spacing + (rand() * 16 - 8);
          const y = row * spacing + (col % 2 === 0 ? 0 : spacing / 2) + (rand() * 16 - 8);
          const angle = rand() * Math.PI * 2;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);
          ctx.drawImage(img, -iconSize / 2, -iconSize / 2, iconSize, iconSize);
          ctx.restore();
        }
      }
    }

    img.onload = drawPattern;
    window.addEventListener('resize', () => { if (img.complete) drawPattern(); });
  </script>
</body>
</html>
