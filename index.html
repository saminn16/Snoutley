<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Snoutley – Löydetty koira</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fefcf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      --bg: #fefcf9;
      --glow: #fefcf9;
      --text-strong: #213731;
      --text-muted: rgba(33, 55, 49, 0.65);
      --text-faint: rgba(33, 55, 49, 0.45);
      --text-faintest: rgba(33, 55, 49, 0.35);
      --button-bg: #ee8b00;
      --button-bg-hover: #d17c00;
      --button-text: #fefcf9;
      --link-underline: rgba(33, 55, 49, 0.25);
      --pattern-opacity: 0.07;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --glow: #202124;
        --text-strong: #fefcf9;
        --text-muted: rgba(254, 252, 249, 0.72);
        --text-faint: rgba(254, 252, 249, 0.5);
        --text-faintest: rgba(254, 252, 249, 0.38);
        --button-bg: #ee8b00;
        --button-bg-hover: #ffa020;
        --button-text: #213731;
        --link-underline: rgba(254, 252, 249, 0.3);
        --pattern-opacity: 0.10;
      }
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: var(--bg);
      color: var(--text-strong);
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease;
    }
    @font-face {
      font-family: 'SnoutleyFont';
      src: url('Snoutley-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: var(--pattern-opacity);
    }
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1rem;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: auto;
      padding-bottom: 4vh;
    }
    .greeting {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
      text-shadow: 0 0 10px var(--glow), 0 0 10px var(--glow), 0 0 10px var(--glow), 0 0 10px var(--glow);
    }
    .pet-name {
      font-family: 'SnoutleyFont', sans-serif;
      font-size: 3.8rem;
      font-weight: normal;
      letter-spacing: 1px;
      margin: 0.4rem 0 0.8rem;
      text-transform: uppercase;
      color: var(--text-strong);
      text-shadow: 0 0 10px var(--glow), 0 0 10px var(--glow), 0 0 10px var(--glow), 0 0 10px var(--glow);
    }
    .lost-message {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      text-shadow: 0 0 10px var(--glow), 0 0 10px var(--glow), 0 0 10px var(--glow), 0 0 10px var(--glow);
    }
    .button {
      padding: 1.1rem 2.2rem;
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--button-text);
      background-color: var(--button-bg);
      border: none;
      border-radius: 10px;
      text-decoration: none;
      transition: background-color 0.3s;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }
    .button:hover {
      background-color: var(--button-bg-hover);
    }
    .button-number {
      font-size: 1rem;
      font-weight: normal;
      opacity: 0.85;
    }
    .owner-info {
      margin-top: 2rem;
    }
    .info {
      font-size: 1.1rem;
      margin: 0.2rem 0;
      color: var(--text-strong);
      text-shadow: 0 0 10px var(--glow), 0 0 10px var(--glow), 0 0 10px var(--glow), 0 0 10px var(--glow);
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 400;
      margin-top: 2rem;
      margin-bottom: 0.3rem;
      color: var(--text-faint);
      letter-spacing: 0.03em;
      text-shadow: 0 0 10px var(--glow), 0 0 10px var(--glow), 0 0 10px var(--glow);
    }
    .allergy-info {
      font-size: 1.1rem;
      color: var(--text-strong);
      text-shadow: 0 0 10px var(--glow), 0 0 10px var(--glow), 0 0 10px var(--glow), 0 0 10px var(--glow);
    }
    .logo {
      max-width: 100px;
      margin-top: 2.5rem;
      margin-bottom: 0.8rem;
      opacity: 0.6;
    }
    .logo-dark {
      display: none;
    }
    @media (prefers-color-scheme: dark) {
      .logo-light {
        display: none;
      }
      .logo-dark {
        display: block;
      }
    }
    .powered-by {
      font-size: 0.75rem;
      color: var(--text-faintest);
      margin-bottom: 0;
      text-shadow: 0 0 10px var(--glow), 0 0 10px var(--glow), 0 0 10px var(--glow);
    }
    .powered-by a {
      color: var(--text-faintest);
      text-decoration: none;
      border-bottom: 1px solid var(--link-underline);
    }
    .powered-by a:hover {
      color: var(--text-faint);
      border-bottom-color: var(--text-faint);
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="container">
    <div class="content">
      <div id="output"></div>
      <div id="call-button"></div>
      <div class="owner-info" id="contact"></div>
      <div id="allergy"></div>
      <img src="green_snoutley.svg" alt="Snoutley logo" class="logo logo-light">
      <img src="snoutley_inverted_green.svg" alt="Snoutley logo" class="logo logo-dark">
      <div class="powered-by">powered by <a href="https://snoutley.fi" target="_blank">Snoutley</a></div>
    </div>
  </div>
  <script>
    const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);

    const output = document.getElementById("output");
    const callButton = document.getElementById("call-button");
    const contact = document.getElementById("contact");
    const allergy = document.getElementById("allergy");
    const lang = navigator.language.startsWith("ru") ? "ru" :
                 navigator.language.startsWith("uk") ? "uk" :
                 navigator.language.startsWith("sv") ? "sv" :
                 navigator.language.startsWith("fi") ? "fi" : "en";
    const raw = location.hash.substring(1).replace(/\+/g, ' ');
    const data = decodeURIComponent(raw).split("|");
    if (data.length >= 4) {
      const [name, phone, dog, allergyVal] = data;
      const translations = {
        fi: {
          greeting: "Hei! Nimeni on:",
          lostMessage: "Olen eksynyt, ole hyvä ja ota yhteyttä omistajaani.",
          owner: `Omistaja: ${capitalize(name)}`,
          button: "Soita omistajalle",
          infoLabel: "Tärkeää tietoa",
        },
        sv: {
          greeting: "Hej! Mitt namn är:",
          lostMessage: "Jag är vilse, kontakta gärna min ägare.",
          owner: `Ägare: ${capitalize(name)}`,
          button: "Ring ägaren",
          infoLabel: "Viktig information",
        },
        ru: {
          greeting: "Привет! Меня зовут:",
          lostMessage: "Я потерялся, пожалуйста, свяжитесь с моим владельцем.",
          owner: `Владелец: ${capitalize(name)}`,
          button: "Позвонить владельцу",
          infoLabel: "Важная информация",
        },
        uk: {
          greeting: "Привіт! Мене звати:",
          lostMessage: "Я загубився, будь ласка, зв'яжіться з моїм власником.",
          owner: `Власник: ${capitalize(name)}`,
          button: "Зателефонувати власнику",
          infoLabel: "Важлива інформація",
        },
        en: {
          greeting: "Hi! My name is:",
          lostMessage: "I'm lost, please contact my owner.",
          owner: `Owner: ${capitalize(name)}`,
          button: "Call owner",
          infoLabel: "Important info",
        }
      };
      const t = translations[lang];
      output.innerHTML = `
        <div class="greeting">${t.greeting}</div>
        <div class="pet-name">${dog}</div>
        <div class="lost-message">${t.lostMessage}</div>
      `;
      callButton.innerHTML = `
        <a class="button" href="tel:${phone}">
          <span>${t.button}</span>
          <span class="button-number">${phone}</span>
        </a>`;
      contact.innerHTML = `
        <div class="info">${t.owner}</div>
      `;
      allergy.innerHTML = `
        <div class="section-title">${t.infoLabel}</div>
        <div class="allergy-info">${allergyVal}</div>
      `;
    } else {
      output.innerHTML = `<p>Virhe: tietojen lukeminen epäonnistui.</p>`;
    }

    // Seeded random — always produces the same pattern
    function seededRandom(seed) {
      let s = seed;
      return function() {
        s = (s * 16807 + 0) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }
    const rand = seededRandom(42);

    // Background pattern
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");
    const img = new Image();
    img.src = "favicon.svg";
    img.onload = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const iconSize = 36;
      const spacing = 90;
      const cols = Math.ceil(canvas.width / spacing) + 2;
      const rows = Math.ceil(canvas.height / spacing) + 2;

      // Canvas 2D context supports the same filter syntax as CSS.
      // In dark mode the icon (a dark brand green) would barely show
      // against the dark background, so we scale its brightness up —
      // this keeps the green hue rather than shifting toward white,
      // unlike invert() would.
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      ctx.filter = isDark ? 'brightness(1.9) saturate(1.15)' : 'none';

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const x = col * spacing + (rand() * 20 - 10);
          const y = row * spacing + (col % 2 === 0 ? 0 : spacing / 2) + (rand() * 20 - 10);
          const angle = rand() * Math.PI * 2;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);
          ctx.drawImage(img, -iconSize / 2, -iconSize / 2, iconSize, iconSize);
          ctx.restore();
        }
      }
    };
  </script>
</body>
</html>
