<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Snoutley – Löydetty koira</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fefcf9">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fefcf9;
      --text-strong: #213731;
      --text-muted: rgba(33, 55, 49, 0.68);
      --text-faint: rgba(33, 55, 49, 0.5);
      --cta-bg: #213731;
      --cta-hover: #2c4940;
      --cta-text: #fefcf9;
      --badge-bg: #f4ebdd;
      --badge-border: rgba(33, 55, 49, 0.12);
      --divider: rgba(33, 55, 49, 0.15);
      --callout-bg: #f4ebdd;
      --callout-border: #ee8b00;
      --focus-ring: #213731;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text-strong);
      font-family: 'Libre Franklin', sans-serif;
    }

    a { color: inherit; }

    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 3px;
    }

    .bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .content-inner {
      width: 100%;
      max-width: 420px;
    }

    /* ---------- Dog name badge ---------- */
    .dog-name-badge {
      display: block;
      width: 100%;
      text-align: center;
      padding: 1.8rem 1.25rem;
      background-color: var(--badge-bg);
      border: 1px solid var(--badge-border);
      border-radius: 8px;
      margin-bottom: 2.6rem;
      text-decoration: none;
    }

    .dog-name {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(1.9rem, 8.5vw, 2.4rem);
      line-height: 1.15;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text-strong);
      margin: 0;
    }

    .lost-message {
      font-family: 'Libre Franklin', sans-serif;
      font-size: 0.98rem;
      color: var(--text-muted);
      text-align: center;
      margin: 0.7rem 0 0;
      line-height: 1.5;
    }

    .hero-title {
      font-family: 'Libre Franklin', sans-serif;
      font-weight: 600;
      font-size: clamp(1.3rem, 5.5vw, 1.7rem);
      color: var(--text-strong);
      text-align: center;
      margin: 0;
      line-height: 1.3;
    }

    /* ---------- Button ---------- */
    .call-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
      padding: 1.6rem 1rem;
      background-color: var(--cta-bg);
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 6px 16px rgba(33, 55, 49, 0.22);
      transition: background-color 0.2s ease;
    }

    .call-button:hover { background-color: var(--cta-hover); }

    .call-button-label {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--cta-text);
    }

    .call-button-number {
      font-family: 'Libre Franklin', sans-serif;
      font-size: 1.02rem;
      font-weight: 500;
      color: var(--cta-text);
      opacity: 0.85;
    }

    /* ---------- Rows ---------- */
    .row {
      text-align: center;
      margin-top: 1.4rem;
    }

    .row-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin: 0 0 0.35rem;
    }

    .row-value {
      font-family: 'Libre Franklin', sans-serif;
      font-weight: 600;
      font-size: 1.3rem;
      color: var(--text-strong);
      margin: 0;
      line-height: 1.3;
    }

    .divider {
      height: 1px;
      width: 100%;
      background: var(--divider);
      border: none;
      margin: 1.8rem 0 0;
    }

    .callout {
      background: var(--callout-bg);
      border-left: 3px solid var(--callout-border);
      padding: 0.9rem 1.1rem;
      border-radius: 4px;
      text-align: left;
      margin-top: 1.8rem;
    }

    .callout .row-label { color: var(--text-muted); }

    /* ---------- Footer ---------- */
    .footer {
      text-align: center;
      padding: 0 1.5rem 2rem;
    }

    .logo {
      max-width: 84px;
      margin-bottom: 0.7rem;
    }

    .powered-by {
      font-size: 0.72rem;
      color: var(--text-faint);
      margin: 0;
    }

    .powered-by a {
      text-decoration: none;
      border-bottom: 1px solid var(--divider);
    }
    .powered-by a:hover { border-bottom-color: var(--text-faint); }
  </style>
</head>
<body>
  <canvas class="bg-canvas" id="bg-canvas"></canvas>
  <div class="page">
    <div class="content">
      <div class="content-inner">
        <div id="name-block"></div>
        <div id="call-button"></div>
        <div id="allergy-row"></div>
      </div>
    </div>
    <div class="footer">
      <img src="green_snoutley.svg" alt="Snoutley logo" class="logo">
      <p class="powered-by">powered by <a href="https://snoutley.fi" target="_blank">Snoutley</a></p>
    </div>
  </div>

  <script>
    const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);

    const nameBlock = document.getElementById("name-block");
    const allergyRow = document.getElementById("allergy-row");
    const callButton = document.getElementById("call-button");

    const lang = navigator.language.startsWith("ru") ? "ru" :
                 navigator.language.startsWith("uk") ? "uk" :
                 navigator.language.startsWith("sv") ? "sv" :
                 navigator.language.startsWith("fi") ? "fi" : "en";
    const raw = location.hash.substring(1).replace(/\+/g, ' ');
    const data = decodeURIComponent(raw).split("|");

    if (data.length >= 4) {
      const [name, phone, dog, allergyVal] = data;
      const translations = {
        fi: {
          lostMessage: "Olen eksynyt, ole hyvä ja ota yhteyttä omistajaani.",
          allergyLabel: "Tärkeää tietoa",
          buttonPrefix: "Soita omistajalle: ",
        },
        sv: {
          lostMessage: "Jag är vilse, kontakta gärna min ägare.",
          allergyLabel: "Viktig information",
          buttonPrefix: "Ring ägaren: ",
        },
        ru: {
          lostMessage: "Я потерялся, пожалуйста, свяжитесь с моим владельцем.",
          allergyLabel: "Важная информация",
          buttonPrefix: "Позвонить владельцу: ",
        },
        uk: {
          lostMessage: "Я загубився, будь ласка, зв'яжіться з моїм власником.",
          allergyLabel: "Важлива інформація",
          buttonPrefix: "Зателефонувати власнику: ",
        },
        en: {
          lostMessage: "I'm lost, please contact my owner.",
          allergyLabel: "Important info",
          buttonPrefix: "Call owner: ",
        }
      };
      const t = translations[lang];

      nameBlock.innerHTML = `
        <a class="dog-name-badge" href="tel:${phone}">
          <p class="dog-name">${dog}</p>
          <p class="lost-message">${t.lostMessage}</p>
        </a>
      `;
      callButton.innerHTML = `
        <a class="call-button" href="tel:${phone}">
          <span class="call-button-label">${t.buttonPrefix}${capitalize(name)}</span>
          <span class="call-button-number">${phone}</span>
        </a>`;
      allergyRow.innerHTML = `
        <hr class="divider">
        <div class="row callout">
          <p class="row-label">${t.allergyLabel}</p>
          <p class="row-value">${allergyVal}</p>
        </div>`;
    } else {
      nameBlock.innerHTML = `<p class="hero-title">Virhe: tietojen lukeminen epäonnistui.</p>`;
    }

    // Seeded random — always produces the same pattern
    function seededRandom(seed) {
      let s = seed;
      return function() {
        s = (s * 16807 + 0) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    // Full-page background pattern. The mark's white detail lines
    // blend into the cream page background, leaving its dark green
    // fill visible at low opacity across the whole page.
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");
    const img = new Image();
    img.src = "favicon.svg";

    function drawPattern() {
      const rand = seededRandom(42);
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 0.06;

      const iconSize = 27;
      const spacing = 60;
      const cols = Math.ceil(canvas.width / spacing) + 2;
      const rows = Math.ceil(canvas.height / spacing) + 2;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const x = col * spacing + (rand() * 18 - 9);
          const y = row * spacing + (col % 2 === 0 ? 0 : spacing / 2) + (rand() * 18 - 9);
          const angle = rand() * Math.PI * 2;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle);
          ctx.drawImage(img, -iconSize / 2, -iconSize / 2, iconSize, iconSize);
          ctx.restore();
        }
      }
    }

    img.onload = drawPattern;
    window.addEventListener('resize', drawPattern);
  </script>
</body>
</html>
