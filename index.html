<style>
:root{
  --green:#213731;
  --orange:#ee8b00;
  --sand:#f4ebdd;
  --ink:#333333;
  --paper:#fefcf9;
  --sand-muted:#c9d1cb;   /* sand mixed into green, for secondary text on green */
  --rule:#e6dccb;

  --bg:var(--paper);
  --text:var(--ink);
  --text-soft:#5f5a52;

  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;

  --pad:clamp(20px,6vw,32px);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
/* Overscroll colours: pulling past the top shows green, pulling past the
   bottom shows the lower section's colour, so the page never splits. */
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body::before{
  content:"";position:fixed;left:0;right:0;top:0;height:50vh;
  background:var(--green);z-index:-1;pointer-events:none;
}
body{
  margin:0;min-height:100svh;display:flex;flex-direction:column;
  color:var(--text);
  font:400 1.0625rem/1.5 var(--body);
}
.sheet{flex:1;display:flex;flex-direction:column;background:var(--bg)}

/* Dark mode: the lower part goes much deeper than the brand green so the
   split stays clear, and the green block gets rounded bottom corners so it
   reads as one solid piece, like the tag itself. */
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1613;--text:var(--sand);--text-soft:#93a39a}
  main{background:var(--bg)}
  .tag{border-radius:0 0 32px 32px}
  .call{box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
  .sheet .wordmark{color:var(--sand)}
  .sheet .powered{color:var(--text-soft)}
}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}

/* ---------- Top: everything the finder needs ---------- */
.tag{
  background:var(--green);color:var(--paper);
  display:flex;flex-direction:column;
  min-height:max(500px,66svh);   /* same green height whatever the content */
  padding:calc(env(safe-area-inset-top,0px) + 18px) var(--pad) 32px;
}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.mark{width:30px;height:auto;color:var(--paper);display:block}

.name{
  font-family:var(--display);
  font-variation-settings:"wdth" 75,"opsz" 96;
  font-weight:750;
  font-size:7.5rem;               /* JS fits this to at most two lines */
  line-height:.86;
  letter-spacing:.01em;
  margin:auto 0 0;padding-top:28px;   /* pushes the content to the bottom of the green */
  overflow-wrap:normal;hyphens:none;
}
.lede{
  margin:18px 0 0;max-width:30ch;
  font-size:1.25rem;line-height:1.4;color:var(--sand);
}
.lede strong{font-weight:600;color:var(--paper)}

.actions{display:grid;gap:10px;margin-top:32px}
.call{
  display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:16px;
  min-height:100px;padding:20px 20px 20px 24px;border-radius:24px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 10px 24px -12px rgba(0,0,0,.55);
  background:var(--orange);color:var(--green);text-decoration:none;
  -webkit-tap-highlight-color:transparent;
  transition:transform .12s ease;
}
.call:active{transform:scale(.98)}
.call-text{display:flex;flex-direction:column;min-width:0}
.call-label{font:700 1.375rem/1.15 var(--body);white-space:nowrap}
.call-icon{
  width:52px;height:52px;border-radius:50%;
  background:var(--green);color:var(--orange);
  display:grid;place-items:center;
}
.call-icon svg{width:24px;height:24px}
.call-number{
  font-family:var(--display);font-variation-settings:"wdth" 85,"opsz" 32;
  font-weight:600;font-size:1.375rem;line-height:1.2;margin-top:4px;
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.sms{
  display:block;padding:10px 2px;
  color:var(--paper);font:500 1.0625rem/1.4 var(--body);
  text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- Below: owner's note + provenance ---------- */
.note{padding:36px var(--pad) 8px;max-width:40rem}
.note h2{
  margin:0 0 6px;font:600 .9375rem/1.3 var(--body);color:var(--text-soft);
}
.note p{margin:0;font-size:1.1875rem;line-height:1.5;white-space:pre-line;max-width:34em}

.foot{
  margin-top:auto;padding:36px var(--pad) calc(env(safe-area-inset-bottom,0px) + 72px);
  display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
}
.foot p{margin:0;max-width:30ch;font-size:.875rem;line-height:1.45;color:var(--text-soft)}
.wordmark{flex:none;display:block;color:var(--green);text-decoration:none}
.wordmark svg{width:104px;height:auto;display:block}
.powered{display:block;margin:0 0 -6px 2px;font-size:.8125rem;line-height:1;color:var(--text-soft)}

@media (min-width:640px){
  .tag,.note,.foot{padding-left:max(var(--pad),calc((100vw - 560px)/2));padding-right:max(var(--pad),calc((100vw - 560px)/2))}
}
@media (prefers-reduced-motion:reduce){.call{transition:none}}
[hidden]{display:none!important}
</style>

<script>

/* Shown when the URL has no tag data (e.g. opening snoutley.online directly).
   Set to null before going live to show the "empty tag" screen instead. */
const PLACEHOLDER = { owner:"Sampo", phone:"0458711994", pet:"Elli", notes:"Ei allergioita." };

const T = {
  fi:{
    title:"Löysit koiran",
    lede:o=> o ? `Koira on eksynyt kotoa. Omistaja on <strong>${o}</strong>.` : "Koira on eksynyt kotoa.",
    call:"Soita omistajalle",
    sms:"Etkö halua soittaa? Lähetä viesti.",
    smsBody:p=> `Löysin koirasi ${p}.`,
    noPhone:"Omistaja ei ole lisännyt puhelinnumeroa. Eläinlääkäri tai löytöeläintalo voi lukea koiran sirun ja tavoittaa omistajan.",
    noteTitle:"Omistajan viesti",
    privacy:"Tiedot luettiin koiran Podi-tunnisteesta. Ne näkyvät vain tällä sivulla eivätkä tallennu minnekään.",
    dog:"Koira"
  },
  sv:{
    title:"Du hittade en hund",
    lede:o=> o ? `Hunden är borta hemifrån. Ägaren heter <strong>${o}</strong>.` : "Hunden är borta hemifrån.",
    call:"Ring ägaren",
    sms:"Vill du inte ringa? Skicka ett meddelande.",
    smsBody:p=> `Jag har hittat din hund ${p}.`,
    noPhone:"Ägaren har inte lagt till ett telefonnummer. En veterinär eller ett djurhem kan läsa hundens mikrochip och nå ägaren.",
    noteTitle:"Meddelande från ägaren",
    privacy:"Uppgifterna lästes från hundens Podi-bricka. De visas bara på den här sidan och sparas inte någonstans.",
    dog:"Hund"
  },
  ru:{
    title:"Вы нашли собаку",
    lede:o=> o ? `Собака потерялась. Владелец: <strong>${o}</strong>.` : "Собака потерялась.",
    call:"Позвонить владельцу",
    sms:"Не хотите звонить? Напишите.",
    smsBody:p=> `Ваша собака ${p} найдена.`,
    noPhone:"Владелец не указал номер телефона. Ветеринар или приют для животных может считать микрочип собаки и связаться с владельцем.",
    noteTitle:"Сообщение от владельца",
    privacy:"Эти данные считаны с метки Podi на ошейнике. Они показаны только на этой странице и нигде не сохраняются.",
    dog:"Собака"
  },
  uk:{
    title:"Ви знайшли собаку",
    lede:o=> o ? `Собака загубилася. Власник: <strong>${o}</strong>.` : "Собака загубилася.",
    call:"Зателефонувати власнику",
    sms:"Не хочете телефонувати? Напишіть.",
    smsBody:p=> `Вашу собаку ${p} знайдено.`,
    noPhone:"Власник не вказав номер телефону. Ветеринар або притулок для тварин може зчитати мікрочип собаки й зв'язатися з власником.",
    noteTitle:"Повідомлення від власника",
    privacy:"Ці дані зчитано з мітки Podi на нашийнику. Вони показані лише на цій сторінці й ніде не зберігаються.",
    dog:"Собака"
  },
  en:{
    title:"You found a dog",
    lede:o=> o ? `This dog is away from home. The owner is <strong>${o}</strong>.` : "This dog is away from home.",
    call:"Call the owner",
    sms:"Don't want to call? Send a message.",
    smsBody:p=> `I found your dog ${p}.`,
    noPhone:"The owner hasn't added a phone number. A vet or animal shelter can read the dog's microchip and reach the owner.",
    noteTitle:"Note from the owner",
    privacy:"This was read from the dog's Podi tag. It is shown only on this page and is not stored anywhere.",
    dog:"Dog"
  }
};

/* Tag payload: #owner|phone|pet|notes, each field encodeURIComponent'd, "|" stored as %7C */
function readTag(){
  const raw = location.hash.slice(1).replace(/\+/g," ");
  if(!raw) return PLACEHOLDER;
  const parts = /%7c/i.test(raw) ? raw.split(/%7c/i) : raw.split("|");
  const dec = s => { try{ return decodeURIComponent(s||"").trim() }catch{ return (s||"").trim() } };
  const [owner,phone,pet,notes] = parts.map(dec);
  if(!owner && !phone && !pet && !notes) return null;
  return {owner,phone,pet,notes};
}

const esc = s => s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dial = p => p.replace(/[^\d+]/g,"");
function pretty(p){
  const d = dial(p);
  if(d.startsWith("+358")){ const r=d.slice(4); return `+358 ${r.slice(0,2)} ${r.slice(2,5)} ${r.slice(5)}`.trim() }
  if(/^0\d{6,}$/.test(d)) return `${d.slice(0,3)} ${d.slice(3,6)} ${d.slice(6)}`;
  return p;
}

const nav = (navigator.language||"fi").toLowerCase();
const local = ["fi","sv","ru","uk"].find(l => nav.startsWith(l)) || "en";
const lang = local;

const tag = readTag();
const $ = id => document.getElementById(id);

function fitName(){
  const el = $("pet");
  if(!el.textContent) return;
  /* short names get a wider cut so they don't turn into vertical bars */
  el.style.fontVariationSettings = `"wdth" ${el.textContent.length <= 6 ? 92 : 75},"opsz" 96`;
  let size = 120;
  const fits = () => {
    el.style.fontSize = size+"px";
    const lines = Math.round((el.clientHeight - parseFloat(getComputedStyle(el).paddingTop)) / (size*0.86));
    el.dataset.lines = lines;
    return el.scrollWidth <= el.clientWidth && lines <= 2;
  };
  while(!fits() && size > 40) size -= 2;
  /* two-line names stay a bit smaller so the green block keeps its height */
  if(el.dataset.lines === "2" && size > 88){ size = 88; fits() }
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(n => { const v=t[n.dataset.t]; if(typeof v==="string") n.textContent=v });

  if(!tag){
    document.title = "Snoutley";
    document.body.hidden = true;   /* nothing on the tag, nothing on the page */
    document.documentElement.style.background = "#fefcf9";
    return;
  } else {
    const pet = tag.pet ? cap(tag.pet) : t.dog;
    document.title = `${pet} · ${t.title}`;
    $("pet").textContent = pet;
    $("lede").innerHTML = t.lede(tag.owner ? esc(cap(tag.owner)) : "");
    const has = !!dial(tag.phone||"");
    $("actions").hidden = !has; $("nophone").hidden = has;
    if(has){
      $("call").href = "tel:"+dial(tag.phone);
      $("number").textContent = pretty(tag.phone);
      const sep = /iPad|iPhone|iPod/.test(navigator.userAgent) ? "&" : "?";
      $("sms").href = `sms:${dial(tag.phone)}${sep}body=${encodeURIComponent(t.smsBody(tag.pet ? cap(tag.pet) : ""))}`;
    }
    $("noteWrap").hidden = !tag.notes;
    $("note").textContent = tag.notes || "";
  }
  fitName();
  fitCall();
}

/* keep the call label on one line in every language (Russian, Ukrainian run long) */
function fitCall(){
  const el = document.querySelector(".call-label");
  let size = 22; el.style.fontSize = size+"px";
  while(el.scrollWidth > el.clientWidth && size > 16){ size -= 1; el.style.fontSize = size+"px" }
}



addEventListener("hashchange", () => location.reload());
addEventListener("resize", () => { fitName(); fitCall() });
document.fonts && document.fonts.ready.then(fitName);
render();
</script>
